name: Release

# Run this from the Actions tab: Release → Run workflow.
# It reads the version from manifest.json and makes a release with that tag.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r .version manifest.json)
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes "Download main.js, manifest.json and styles.css into your vault's plugin folder. See the README for steps." \
            main.js manifest.json styles.css
